<!DOCTYPE html>
<html>
<head>
    <title>Test Onglets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h2>Test des Onglets</h2>
        
        <ul class="nav nav-tabs" id="testTabs" role="tablist">
            <li class="nav-item">
                <a class="nav-link active" id="tab1-tab" data-toggle="tab" href="#tab1" role="tab">Onglet 1</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab2-tab" data-toggle="tab" href="#tab2" role="tab">Onglet 2</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="tab3-tab" data-toggle="tab" href="#tab3" role="tab">Onglet 3</a>
            </li>
        </ul>
        
        <div class="tab-content" id="testTabsContent">
            <div class="tab-pane fade show active" id="tab1" role="tabpanel">
                <h3>Contenu Onglet 1</h3>
                <p>Ceci est le contenu du premier onglet.</p>
            </div>
            <div class="tab-pane fade" id="tab2" role="tabpanel">
                <h3>Contenu Onglet 2</h3>
                <p>Ceci est le contenu du deuxième onglet.</p>
            </div>
            <div class="tab-pane fade" id="tab3" role="tabpanel">
                <h3>Contenu Onglet 3</h3>
                <p>Ceci est le contenu du troisième onglet.</p>
            </div>
        </div>
    </div>
    
    <script>
    $(document).ready(function() {
        $('#testTabs a').on('click', function (e) {
            e.preventDefault();
            $(this).tab('show');
        });
    });
    </script>
</body>
</html>
